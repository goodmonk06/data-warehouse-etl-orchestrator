version: '3.8'

services:
  # Control database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: etl_orchestrator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - etl-network

  # Example source database (for testing Postgres connector)
  source_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sourceuser
      POSTGRES_PASSWORD: sourcepass
      POSTGRES_DB: sourcedb
    ports:
      - "5433:5432"
    volumes:
      - source_data:/var/lib/postgresql/data
      - ./examples/source-db-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourceuser"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - etl-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/etl_orchestrator?schema=public"
      WAREHOUSE_TYPE: "duckdb"
      DUCKDB_PATH: "/app/data/warehouse.duckdb"
      API_PORT: 3001
      API_HOST: "0.0.0.0"
    volumes:
      - warehouse_data:/app/data
      - pipeline_logs:/app/logs
      - ./examples/transforms:/app/examples/transforms
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - etl-network
    restart: unless-stopped

  # Worker (Scheduler)
  worker:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile.worker
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/etl_orchestrator?schema=public"
      WAREHOUSE_TYPE: "duckdb"
      DUCKDB_PATH: "/app/data/warehouse.duckdb"
      ENABLE_SCHEDULER: "true"
    volumes:
      - warehouse_data:/app/data
      - pipeline_logs:/app/logs
      - ./examples/transforms:/app/examples/transforms
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - etl-network
    restart: unless-stopped

  # UI
  ui:
    build:
      context: .
      dockerfile: packages/ui/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
    depends_on:
      - api
    networks:
      - etl-network
    restart: unless-stopped

volumes:
  postgres_data:
  source_data:
  warehouse_data:
  pipeline_logs:

networks:
  etl-network:
    driver: bridge
